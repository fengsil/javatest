spring.application.name=test1

server.port=8080

# Open the hello world home page (/) after startup, set false to disable
app.open-browser.enabled=true

# MySQL: hospital systems
spring.datasource.url=jdbc:mysql://localhost:3306/hospital%20systems?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# logging
logging.level.com.example.test1.mapper=debug
